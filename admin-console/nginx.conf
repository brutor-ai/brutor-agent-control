# =============================================================================
# Nginx Configuration for the Brutor Agent Control Admin Console
# Optimized for React SPA with proper routing and security headers
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No nginx version in the Server header or on error pages.
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    server {
        listen 3002;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (nginx-security-headers.conf, copied by both
        # Dockerfiles). nginx inherits add_header from this level only into a
        # block that has no add_header of its own, so every location below
        # that sets a header includes them again
        # (src/__tests__/securityHeaders.test.ts).
        include /etc/nginx/security-headers.conf;

        # Cache static assets. Monaco's worker scripts end in .js and are
        # served here too, with the JavaScript type mime.types gives them.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            access_log off;
        }

        # Don't cache HTML. Every address of the application ends here: the
        # last argument of try_files below is an internal redirect to
        # /index.html.
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        # SPA routing - all routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            default_type text/plain;
            include /etc/nginx/security-headers.conf;
            return 200 "healthy\n";
        }

        # Disable access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}