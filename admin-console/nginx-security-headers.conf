# =============================================================================
# The security headers of every response of the Admin Console.
#
# Included by the server block of nginx.conf and by every location in it that
# sets a header of its own: nginx inherits add_header from the level above
# only into a block that has no add_header of its own. Both Dockerfiles copy
# this file to /etc/nginx/security-headers.conf.
# Checked by src/__tests__/securityHeaders.test.ts.
# =============================================================================

# The console may not be framed: X-Frame-Options, and frame-ancestors for the
# browsers that read the Content-Security-Policy instead. Both work as
# response headers only, never in a <meta> tag.
add_header X-Frame-Options "DENY" always;

# The console's policy (Monaco evaluates code and runs blob workers; tenant
# logos come from external URLs), plus frame-ancestors. vite.config.ts reads
# this file, so the dev server and `vite preview` send the same headers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:* https:; font-src 'self' data:; connect-src 'self' ws: wss: http://localhost:* https://*; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The browser's own filter is switched off: where it still exists it can be
# turned against the page it filters.
add_header X-XSS-Protection "0" always;
