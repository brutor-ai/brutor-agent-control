# cargo-deny policy: advisories, licences, bans and sources of the dependency graph.
#
# Run: `cargo deny --locked check`. The same policy as the Core Gateway's root
# `deny.toml`: the same licence allow-list, the same bans, crates.io only.
# Every exception names its reason; remove it when the reason goes away.
# Changes to this file are gate changes.

[graph]
all-features = true

# ── Advisories (RustSec) ────────────────────────────────────────────────────
[advisories]
# Vulnerabilities fail. Unmaintained crates fail only when we depend on them
# directly; yanked crates are reported for triage.
unmaintained = "workspace"
yanked = "warn"

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.93
# The Core Gateway's allow-list, all permissive. A new license fails the
# build until reviewed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
# Crates in more than one version are reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# One TLS stack (rustls).
deny = [
    { name = "openssl-sys", reason = "TLS is rustls only" },
    { name = "openssl", reason = "TLS is rustls only" },
    { name = "native-tls", reason = "TLS is rustls only" },
]

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
# crates.io. Nothing else: the Skill Runner has no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
