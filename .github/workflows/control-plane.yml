# The Control Plane (control-plane/): the Community suite with no Enterprise
# package installed, the dependency audit, the fresh-install schema on
# PostgreSQL, the Core Gateway's schema fixture held to this schema, the
# Community third-party licence file regenerated on Linux and compared, and the
# Community image built and started. No repository secret: the Python/Rust
# parity tests read the Core Gateway from the sibling directory core-gateway/.

name: Control Plane

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "core-gateway/**"
      - ".github/workflows/control-plane.yml"
      - "package/docker-bake.hcl"
  pull_request:
    paths:
      - "control-plane/**"
      - "core-gateway/**"
      - ".github/workflows/control-plane.yml"
      - "package/docker-bake.hcl"
  workflow_dispatch:

# One run per ref at a time, to keep CI cost down. A newer push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: control-plane

jobs:
  test-community:
    # A cold run (no pip cache) of the whole suite takes about an hour on ubuntu-latest.
    timeout-minutes: 90
    name: Tests (Community Edition)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Delete the Enterprise package
        run: |
          rm -rf enterprise
          test ! -e enterprise

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml

      - name: Install the Community package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: No Enterprise package and no Enterprise-only library is installed
        run: |
          for module in brutor_enterprise docker kubernetes qdrant_client aiohttp croniter; do
            if python -c "import $module" 2>/dev/null; then
              echo "::error::\`import $module\` works in the Community environment"
              exit 1
            fi
          done
          brutor-agent-control-plane --help > /dev/null
        env:
          DATABASE_URL: postgresql://nobody:nothing@127.0.0.1:1/none

      # The parity tests read the Core Gateway's Rust sources: the sibling directory.
      - name: Run the Community suite as the Community Edition
        env:
          BRUTOR_CORE_REPO: ${{ github.workspace }}/core-gateway
          BRUTOR_TEST_EDITION: community
        run: pytest -q --cov tests/

  audit:
    timeout-minutes: 20
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml

      - name: Install package + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency audit (pip-audit, high and above)
        run: |
          pip install pip-audit
          pip freeze --exclude-editable > /tmp/audit-requirements.txt
          pip-audit --strict --desc on --no-deps --disable-pip -r /tmp/audit-requirements.txt

  # The Community image's third-party licences: THIRD_PARTY_LICENSES
  # regenerated on Linux from the lock with the generator the image runs; a
  # difference fails. (The Enterprise file is not in this repository.)
  third-party-licences:
    timeout-minutes: 20
    name: Third-party licences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: libpq for psycopg2, which regenerate builds from source as the images do
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: The Community file is current
        run: python scripts/third_party_licenses.py regenerate community --check

  fresh-install:
    timeout-minutes: 20
    name: Fresh-install schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brutor
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: brutor_fresh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # This repository has no Enterprise package: the tests run as the Community Edition.
      BRUTOR_TEST_EDITION: community
      BRUTOR_PG_TESTS: "1"
      BRUTOR_PG_TEST_URL: postgresql://brutor:throwaway@localhost:5432/brutor_fresh_test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters
      ENCRYPTION_KEY: ci-test-encryption-key-32chars-padding======

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Boot a fresh install and verify the schema is complete
        run: pytest tests/test_fresh_install_schema.py -q

      - name: Runs API routes answer on Postgres
        run: pytest tests/test_ai_system_runs_routes_smoke.py -q

      - name: Judgement exclusion per signal on Postgres
        run: pytest tests/test_judgement_exclusion_single_predicate.py -q

  # The Core Gateway's integration tests clone their database from a dump of
  # this schema; a Control Plane migration is what makes it stale, so the
  # check runs here.
  rust-schema-fixture:
    timeout-minutes: 20
    name: Rust schema fixture drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brutor
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: brutor_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brutor:throwaway@localhost:5432/brutor_schema
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters
      ENCRYPTION_KEY: ci-test-encryption-key-32chars-padding======
      BRUTOR_DEFAULT_TENANT_ADMIN_PASSWORD: ci-only-not-a-real-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install matching postgresql-client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-16

      # adapted: the runner's `pg_dump` is a wrapper that picks the newest installed client, not the one installed above; a newer pg_dump writes statements the fixture does not have
      - name: The server's pg_dump first on PATH
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      # adapted: the same three statements without the linter comment, which reads as a record number to the reference scan
      - name: Build the schema the way an install does
        run: python -c "import app.database as db, app.database.models; db.init_database()"

      # adapted: the fixture and its script are in the sibling directory core-gateway/, not in a second checkout
      - name: Compare the Rust fixture against this schema
        env:
          BRUTOR_SCHEMA_DUMP_MODE: local
        run: ../core-gateway/tests/migrations/regen-schema.sh --check

  # The Community image: no Enterprise package or library, refuses a first
  # start without the administrator's password, starts with no licence key.
  image:
    name: Community image
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brutor
          POSTGRES_PASSWORD: smoke-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # adapted: the image is built through package/docker-bake.hcl, as publish-images.yml builds it, under a local tag (the bake file is the one place the published names are written)
      - name: Build the Community image
        working-directory: .
        run: docker buildx bake -f package/docker-bake.hcl control-plane --load --set control-plane.tags=control-community:ci

      - name: Import the application factory; the Enterprise package is not importable
        env:
          NO_DATABASE: postgresql://nobody:nothing@127.0.0.1:1/none
        run: |
          docker run --rm -e DATABASE_URL="$NO_DATABASE" control-community:ci \
            python -c "from app.app import create_app; print('Community factory imports')"
          if docker run --rm -e DATABASE_URL="$NO_DATABASE" control-community:ci \
            python -c "import brutor_enterprise" 2>/dev/null; then
            echo "::error::the Community image can import the Enterprise package"
            exit 1
          fi
          docker run --rm control-community:ci gunicorn --version

      # adapted: the Community image only (the script's usage line takes --community alone)
      - name: Smoke the Community image
        env:
          SMOKE_PG_PORT: "5432"
          SMOKE_PG_USER: brutor
          SMOKE_PG_PASSWORD: smoke-only
          SMOKE_REDIS_URL: redis://host.docker.internal:6379/15
        run: scripts/smoke_images.sh --community control-community:ci
