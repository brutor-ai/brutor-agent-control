# The Community stack built from this checkout and started as a download
# starts it: deploy/compose/ with its build override
# (docker-compose.build.yml), which builds every service's image from its
# component directory. The package's own start script fills the empty secrets
# of the .env template and waits until every service reports healthy
# (`docker compose up --wait`); a service that does not fails the job. No
# repository secret.

name: Compose from source

on:
  push:
    branches: [main]
    paths:
      - "core-gateway/**"
      - "control-plane/**"
      - "admin-console/**"
      - "skill-runner/**"
      - "witness/**"
      - "deploy/compose/**"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "core-gateway/**"
      - "control-plane/**"
      - "admin-console/**"
      - "skill-runner/**"
      - "witness/**"
      - "deploy/compose/**"
      - ".github/workflows/compose.yml"
  workflow_dispatch:

# One run per ref at a time. A newer push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: deploy/compose

jobs:
  from-source:
    timeout-minutes: 90
    name: Build from source, start, every service healthy
    runs-on: ubuntu-latest
    env:
      # Both files, for every docker compose command of the job.
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # adapted: the package's start script, as a person runs it in a clone; COMPOSE_FILE adds the build override
      - name: Build every image from its directory and start the stack until it is healthy
        run: ./start.sh

      # adapted: what a failed start needs to be read
      - name: Service state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      # adapted: the stack and its volumes go with the job
      - name: Remove the stack and its data
        if: always()
        run: docker compose down -v
