# Checks of the whole repository, on every pull request and every push to
# main (the first push is the import commit):
#   - editions.yaml against the code (check_editions.py, public layout);
#   - the licence header of every source file (scripts/licence_headers.py);
#   - no reference to a record kept outside this repository in the files no
#     component's suite scans (control-plane/tests/private_references.py);
#   - no secret (gitleaks, a pinned release, its checksum verified; the
#     allow-list is .gitleaks.toml, every entry with its reason).
# No repository secret. gitleaks runs as its released binary, not through
# its GitHub action (the action wants a licence key for an organisation).

name: Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  editions:
    timeout-minutes: 10
    name: Edition boundary (editions.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # adapted: new; check_editions.py reads editions.yaml with PyYAML
      - name: Check editions.yaml against the code
        run: |
          python -m pip install pyyaml==6.0.3
          python check_editions.py --layout public

  licence-headers:
    timeout-minutes: 10
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # adapted: new; every source file carries the Community header and no other
      - name: Every source file carries the Apache-2.0 header
        run: python3 scripts/licence_headers.py check . --edition community

  private-references:
    timeout-minutes: 10
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # adapted: the Control Plane's scanner (the same rules in every component). Each component's own
      # suite runs it over its directory with that component's declarations; this job reads the rest.
      - name: Scan what no component's suite scans
        run: python3 control-plane/tests/private_references.py . --left-out core-gateway/ --left-out control-plane/ --left-out admin-console/ --left-out skill-runner/ --declared scripts/private_references.json

  secrets:
    timeout-minutes: 15
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # adapted: new; the pinned release, checked against its published sha256 before it runs
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # adapted: new; a pull request's own commits, else the whole history (from the import commit on)
      - name: Scan for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$BASE..$HEAD" .
          else
            /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          fi
