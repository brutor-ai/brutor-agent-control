[package]
name = "brutor-evidence"
version = "0.1.0"
edition = "2024"
description = "Brutor action records (ai.brutor/action-record/v1): canonicalisation, sealing as RFC 9943 Signed Statements, and the semantic verifier"
license = "Apache-2.0"
publish = false
authors = ["Brutor AI Ltd"]

[dependencies]
brutor-cose = { path = "../brutor-cose" }
brutor-ctlog = { path = "../brutor-ctlog" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shortest round-trip digits (ties to even) for RFC 8785 §3.2.2.3 numbers.
ryu = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
thiserror = "2"

[dev-dependencies]

# Evidence crates contain no unsafe Rust and never may.
[lints.rust]
unsafe_code = "forbid"
