# =============================================================================
# Grafana Datasource Provisioning
#
# Auto-configures Prometheus and Loki as data sources on first boot.
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
