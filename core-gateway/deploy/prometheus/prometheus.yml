# =============================================================================
# Prometheus Configuration
#
# Scrapes metrics from two sources:
#   1. OTel Collector (:8889) — OTLP metrics converted to Prometheus format
#   2. Brutor Agent Control Core Gateway (:8100/metrics) — native Prometheus endpoint
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics forwarded through the OTel Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: "otlp"

  # Native Prometheus metrics from the proxy's metrics listener
  # (BRUTOR_METRICS_LISTEN_ADDR, :9464; /metrics is not on the proxy port).
  - job_name: "brutor-gateway-core"
    metrics_path: /metrics
    static_configs:
      - targets: ["brutor-gateway-core:9464"]
        labels:
          source: "direct"
