# Alembic configuration for Brutor Agent Control Plane
#
# Migrations live in ./alembic/versions/
# Run with:
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current
#   alembic history

[alembic]
script_location = alembic

# Use timezone-aware UTC timestamps in migration file names
timezone = UTC

# Prepend the migration file name with a timestamp for readability
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database URL is read from the app's environment (DATABASE_URL) via env.py.
# Do NOT hardcode it here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Optional: format generated migrations with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
