    <rect x="7"  y="6"  width="2.5" height="12" rx="1" fill="#F037A5"/>
    <rect x="11" y="3"  width="2.5" height="18" rx="1" fill="#F037A5"/>
    <rect x="15" y="6"  width="2.5" height="12" rx="1" fill="#F037A5"/>
    <rect x="19" y="9"  width="2.5" height="6"  rx="1" fill="#F037A5"/>
</svg>
