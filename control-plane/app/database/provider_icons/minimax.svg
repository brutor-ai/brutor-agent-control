<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Audio-wave mark for MiniMax. Five bars of varying height
         evoke their speech / multimodal heritage. Brand colour
         (#F037A5) matches the magenta wordmark on minimax.io. -->
